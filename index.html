<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>P.A.T.I.H — Intelligent Ops</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            /* Dark Blue Background */
            --card-bg: #1e293b;
            /* Card Background */
            --text-primary: #f8fafc;
            /* White Text */
            --text-secondary: #94a3b8;
            /* Grey Text */
            --accent: #3b82f6;
            /* Blue Accent */
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .header p {
            margin: 5px 0 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
        }

        label i {
            margin-right: 5px;
            color: var(--accent);
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        select:focus,
        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Tombol Kamera Kustom */
        .camera-upload {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .camera-btn {
            border: 2px dashed var(--border);
            color: var(--text-secondary);
            background-color: rgba(59, 130, 246, 0.05);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .camera-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .camera-btn.uploaded {
            border-color: var(--success);
            color: var(--success);
            background-color: rgba(16, 185, 129, 0.1);
        }

        input[type="file"] {
            position: absolute;
            font-size: 100px;
            opacity: 0;
            right: 0;
            top: 0;
        }

        button.submit-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        button.submit-btn:active {
            transform: scale(0.98);
        }

        button.submit-btn:disabled {
            background-color: var(--border);
            color: var(--text-secondary);
            cursor: not-allowed;
            box-shadow: none;
        }

        .status-msg {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .status-msg.success {
            color: var(--success);
        }

        .status-msg.error {
            color: var(--danger);
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>P.A.T.I.H</h1>
        <p>Platform Aset & Tiketing Intelligent Hive</p>
    </div>

    <div class="container">
        <div class="card">
            <form id="laporanForm">

                <div class="form-group">
                    <label for="sku"><i class="fas fa-server"></i> Pilih Aset / Material</label>
                    <select id="sku" name="sku" required>
                        <option value="">⏳ Menghubungkan ke Neural Core...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="act"><i class="fas fa-exchange-alt"></i> Jenis Tindakan</label>
                    <select id="act" name="act" required>
                        <option value="INSTALLED">🏠 PASANG KE USER (Instalasi)</option>
                        <option value="EX">🟡 TARIK KE GUDANG (Dismantle)</option>
                        <option value="BROKEN">🔴 RETUR RUSAK (Broken)</option>
                        <option value="NEW">📦 STOK BARU (Restock)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="qty"><i class="fas fa-layer-group"></i> Jumlah Unit</label>
                    <input type="number" id="qty" name="qty" value="1" min="1" required>
                </div>

                <div class="form-group">
                    <label for="note"><i class="fas fa-clipboard-list"></i> Catatan Lapangan</label>
                    <textarea id="note" name="note" rows="2"
                        placeholder="Contoh: Pasang baru di rumah Bpk Budi (ID: 12345)"></textarea>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-camera"></i> Bukti Foto</label>
                    <div class="camera-upload">
                        <label for="photo" class="camera-btn" id="cameraLabel">
                            <i class="fas fa-camera-retro"></i> Buka Kamera
                        </label>
                        <input type="file" id="photo" name="photo" accept="image/*" capture="environment" required>
                    </div>
                </div>

                <input type="hidden" id="chat_id" name="chat_id">
                <input type="hidden" id="username" name="username">
                <input type="hidden" id="lat" name="lat">
                <input type="hidden" id="lng" name="lng">

                <button type="submit" class="submit-btn" id="btnSubmit">
                    <i class="fas fa-satellite-dish"></i> KIRIM LAPORAN
                </button>

                <div id="statusBox" class="status-msg"></div>

            </form>
        </div>
    </div>

    <script>
        // --- KONFIGURASI N8N ---
        // GANTI URL DI BAWAH INI DENGAN BASE URL WEBHOOK N8N ANDA
        // Contoh: "https://n8ring.gatrapurna.my.id/webhook/patih-v9/brain"
        const N8N_BASE_URL = "YOUR_N8N_WEBHOOK_URL_HERE";

        // Endpoint Turunan (Jangan Diubah jika JSON n8n tidak berubah)
        const URL_GET_SKU = `${N8N_BASE_URL}/get-sku-list`;
        const URL_SUBMIT = `${N8N_BASE_URL}/patih-v9/brain`;

        // --- INISIALISASI ---
        const tg = window.Telegram.WebApp;
        tg.expand();
        const btnSubmit = document.getElementById('btnSubmit');
        const statusBox = document.getElementById('statusBox');

        // 1. Identifikasi User Telegram
        if (tg.initDataUnsafe?.user) {
            document.getElementById('chat_id').value = tg.initDataUnsafe.user.id;
            document.getElementById('username').value = tg.initDataUnsafe.user.first_name;
        } else {
            // Debug Mode (Jika dibuka di Browser biasa)
            console.warn("Mode Debug: Bukan di Telegram");
        }

        // 2. Load Data SKU dari n8n
        fetch(URL_GET_SKU)
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('sku');
                select.innerHTML = '<option value="">-- Pilih Aset --</option>';
                data.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.sku;
                    opt.textContent = `${item.name} (${item.sku})`;
                    select.appendChild(opt);
                });
            })
            .catch(err => {
                document.getElementById('sku').innerHTML = '<option value="">❌ Gagal Koneksi Server</option>';
                showStatus("Gagal memuat database SKU. Cek koneksi internet.", "error");
            });

        // 3. Handle GPS (Wajib)
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                document.getElementById('lat').value = pos.coords.latitude;
                document.getElementById('lng').value = pos.coords.longitude;
            },
            (err) => {
                showStatus("⚠️ Wajib aktifkan GPS untuk mengirim laporan!", "error");
                btnSubmit.disabled = true;
            },
            { enableHighAccuracy: true }
        );

        // 4. Visualisasi Upload Foto
        document.getElementById('photo').addEventListener('change', function (e) {
            if (this.files[0]) {
                const label = document.getElementById('cameraLabel');
                label.innerHTML = `<i class="fas fa-check-circle"></i> Foto Siap: ${this.files[0].name}`;
                label.classList.add('uploaded');
            }
        });

        // 5. Submit Form
        document.getElementById('laporanForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            // Validasi GPS
            if (!document.getElementById('lat').value) {
                tg.showAlert("📍 Sedang mencari lokasi... Tunggu sebentar.");
                return;
            }

            // UI Loading
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MENGIRIM DATA...';

            const formData = new FormData(this);

            try {
                const response = await fetch(URL_SUBMIT, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.status === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                    showStatus("✅ Laporan Berhasil Diterima Pusat!", "success");

                    // Delay sejenak lalu tutup
                    setTimeout(() => tg.close(), 2000);
                } else {
                    throw new Error(result.message || "Server Error");
                }
            } catch (error) {
                tg.HapticFeedback.notificationOccurred('error');
                showStatus("❌ Gagal: " + error.message, "error");
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="fas fa-satellite-dish"></i> KIRIM ULANG';
            }
        });

        function showStatus(msg, type) {
            statusBox.textContent = msg;
            statusBox.className = "status-msg " + type;
            statusBox.style.display = "block";
        }
    </script>

</body>

</html>
