<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>P.A.T.I.H V1.3 — Smart Ops</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #3b82f6; --success: #10b981; --warning: #f59e0b; --border: #334155; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 0.85rem; font-weight: 600; }
        select, input, textarea { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 10px; box-sizing: border-box; font-size: 15px; margin-bottom: 15px; }
        select:focus, input:focus { border-color: var(--accent); outline: none; }
        
        /* Custom Category Input (Hidden by default) */
        #custom_cat_box { display: none; border-left: 3px solid var(--warning); padding-left: 10px; margin-bottom: 15px; }

        /* Camera & Buttons */
        .camera-wrapper { position: relative; width: 100%; height: 80px; background: rgba(59, 130, 246, 0.05); border: 2px dashed #475569; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 5px; }
        .camera-wrapper.has-file { border-style: solid; border-color: var(--success); background: rgba(16, 185, 129, 0.1); }
        .direct-cam-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .optional-badge { font-size: 10px; background: #334155; padding: 2px 6px; border-radius: 4px; color: #cbd5e1; margin-left: 5px; }
        
        .btn-scan { width: 100%; padding: 12px; border-radius: 10px; background: var(--warning); color: #0f172a; font-weight: bold; border: none; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-submit { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; }
        
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; display: none; border: 2px solid var(--warning); }
        .status-msg { text-align: center; font-size: 0.9rem; margin-top: 10px; display: none; padding: 10px; border-radius: 8px; }
        .success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .error { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    </style>
</head>
<body>
    <div style="text-align: center; margin-bottom: 15px;">
        <h2 style="margin:0; color: var(--accent);">P.A.T.I.H V1.3</h2>
        <p style="margin:2px 0 0; font-size: 0.75rem; color: #64748b;">Platform Aset & Tiketing Intelligent Hive</p>
    </div>

    <div class="card">
        <div id="reader"></div>
        <form id="patihForm">
            <label><i class="fas fa-exchange-alt"></i> Tipe Transaksi</label>
            <select id="act" required>
                <option value="INSTALLED">🏠 PASANG (Instalasi)</option>
                <option value="EX">🟡 TARIK (Dismantle)</option>
                <option value="BROKEN">🔴 RETUR (Rusak)</option>
                <option value="NEW">📦 STOK BARU (Restock)</option>
            </select>

            <label><i class="fas fa-filter"></i> Kategori Perangkat</label>
            <select id="category_select" onchange="filterSku(this.value)">
                <option value="ALL">-- Tampilkan Semua --</option>
                <option value="OTHER">➕ Lainnya (Input Manual)</option>
            </select>
            
            <div id="custom_cat_box">
                <input type="text" id="custom_category" placeholder="Tulis Nama Kategori Baru...">
            </div>

            <button type="button" id="btnScan" class="btn-scan"><i class="fas fa-qrcode"></i> SCAN BARCODE</button>
            
            <label><i class="fas fa-barcode"></i> Serial Number / SKU</label>
            <input type="text" id="sku_input" list="sku_list" placeholder="Scan atau Ketik Manual..." required autocomplete="off">
            <datalist id="sku_list">
                </datalist>

            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
                <div><label>Qty</label><input type="number" id="qty" value="1" min="1" required></div>
                <div><label>GPS</label><input type="text" id="gps" placeholder="Mencari Satelit..." readonly style="font-size: 12px; color: #fbbf24;"></div>
            </div>

            <label><i class="fas fa-camera"></i> Bukti Foto <span class="optional-badge">OPSIONAL</span></label>
            <div class="camera-wrapper" id="camWrap">
                <div style="text-align:center; color:#94a3b8; pointer-events:none;" id="camLabel">
                    <i class="fas fa-camera"></i><br><span style="font-size:10px">Ketuk untuk Foto</span>
                </div>
                <input type="file" id="photo" class="direct-cam-input" accept="image/*" capture="environment" onchange="previewPhoto(this)">
            </div>

            <label>Catatan</label>
            <textarea id="note" rows="2" placeholder="No. Tiket / Keterangan"></textarea>
            
            <button type="submit" id="btnSubmit" class="btn-submit"><i class="fas fa-paper-plane"></i> KIRIM DATA</button>
            <div id="statusBox" class="status-msg"></div>
        </form>
    </div>

    <script>
        const N8N_HOST = "https://n8ring.gatrapurna.my.id/webhook"; // Sesuaikan URL
        
        const tg = window.Telegram.WebApp;
        const html5QrCode = new Html5Qrcode("reader");
        let lat = null, lng = null;
        let allItems = []; // Simpan semua data dari server

        tg.ready(); tg.expand();

        // A. FETCH DATA & POPULATE
        fetch(`${N8N_HOST}/get-sku-list`)
            .then(res => res.json())
            .then(data => {
                allItems = data;
                populateCategories(data);
                populateDatalist(data); // Awal: tampilkan semua
            })
            .catch(err => console.error("Gagal load SKU:", err));

        function populateCategories(data) {
            const cats = [...new Set(data.map(i => i.category || 'UMUM'))].sort();
            const sel = document.getElementById('category_select');
            
            // Hapus opsi lama kecuali default
            while(sel.options.length > 2) sel.remove(1);

            cats.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.textContent = c.toUpperCase();
                sel.insertBefore(opt, sel.lastElementChild); // Insert sebelum "Lainnya"
            });
        }

        function populateDatalist(items) {
            const dl = document.getElementById('sku_list');
            dl.innerHTML = '';
            items.forEach(i => {
                const opt = document.createElement('option');
                opt.value = i.sku; // Value yang masuk input
                opt.textContent = `${i.name} [${i.category}]`; // Label suggestion
                dl.appendChild(opt);
            });
        }

        // B. FILTER LOGIC
        window.filterSku = function(category) {
            const customBox = document.getElementById('custom_cat_box');
            const skuInput = document.getElementById('sku_input');
            
            // Handle "LAINNYA"
            if (category === 'OTHER') {
                customBox.style.display = 'block';
                document.getElementById('custom_category').required = true;
                populateDatalist([]); // Kosongkan suggestion agar fokus input manual
            } else {
                customBox.style.display = 'none';
                document.getElementById('custom_category').required = false;
                
                // Filter Datalist
                if (category === 'ALL') populateDatalist(allItems);
                else {
                    const filtered = allItems.filter(i => (i.category || 'UMUM') == category);
                    populateDatalist(filtered);
                }
            }
            // JANGAN clear input SKU agar scan tidak hilang
        };

        // C. SCANNER LOGIC (SMART)
        let isScanning = false;
        document.getElementById('btnScan').onclick = () => {
            if(!isScanning){
                document.getElementById('reader').style.display='block';
                html5QrCode.start({facingMode:"environment"}, {fps:10, qrbox:250}, (decoded)=>{ handleScan(decoded); stopScan(); }, ()=>{});
                document.getElementById('btnScan').innerHTML='STOP'; document.getElementById('btnScan').style.background='#ef4444'; isScanning=true;
            } else stopScan();
        };
        function stopScan(){ html5QrCode.stop().then(()=>{ document.getElementById('reader').style.display='none'; document.getElementById('btnScan').innerHTML='<i class="fas fa-qrcode"></i> SCAN BARCODE'; document.getElementById('btnScan').style.background='#f59e0b'; isScanning=false; }); }

        function handleScan(code) {
            // 1. Isi Input
            document.getElementById('sku_input').value = code;
            
            // 2. Cari di Database Lokal
            const found = allItems.find(i => i.sku === code);
            
            if (found) {
                // Jika ada, set kategori otomatis
                const catSelect = document.getElementById('category_select');
                catSelect.value = found.category || 'ALL';
                filterSku(found.category || 'ALL'); // Refresh UI
                tg.showAlert(`✅ Dikenali: ${found.name}`);
            } else {
                // Jika baru, minta user pilih kategori
                tg.showAlert(`⚠️ Item Baru: ${code}\nSilakan pilih Kategori.`);
                document.getElementById('category_select').focus();
            }
            tg.HapticFeedback.notificationOccurred('success');
        }

        // D. GPS & PHOTO
        navigator.geolocation.getCurrentPosition(p => { lat=p.coords.latitude; lng=p.coords.longitude; document.getElementById('gps').value=`${lat.toFixed(5)},${lng.toFixed(5)}`; }, ()=>document.getElementById('gps').value="⚠️ GPS Error");
        
        window.previewPhoto = function(input) {
            if(input.files[0]) {
                document.getElementById('camLabel').innerHTML = `<i class="fas fa-check" style="color:#10b981"></i> OK`;
                document.getElementById('camWrap').classList.add('has-file');
            }
        }

        // E. SUBMIT HANDLER
        document.getElementById('patihForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const sku = document.getElementById('sku_input').value;
            let cat = document.getElementById('category_select').value;
            
            // Ambil custom category jika dipilih
            if (cat === 'OTHER') {
                cat = document.getElementById('custom_category').value.toUpperCase();
            }

            if(!sku) return tg.showAlert("SKU Wajib Diisi!");
            
            btn.disabled=true; btn.innerHTML='MENGIRIM...';
            
            const fd = new FormData();
            fd.append('sku', sku);
            fd.append('category', cat); // Kirim kategori final
            fd.append('act', document.getElementById('act').value);
            fd.append('qty', document.getElementById('qty').value);
            fd.append('note', document.getElementById('note').value);
            fd.append('lat', lat||''); fd.append('lng', lng||'');
            
            if(document.getElementById('photo').files[0]) fd.append('photo', document.getElementById('photo').files[0]);
            if(tg.initDataUnsafe?.user) {
                fd.append('chat_id', tg.initDataUnsafe.user.id);
                fd.append('username', tg.initDataUnsafe.user.first_name);
            }

            try {
                const res = await fetch(`${N8N_HOST}/patih-v9/brain`, { method:'POST', body:fd });
                const json = await res.json();
                if(json.status==='success'){
                    document.getElementById('statusBox').innerHTML = json.message;
                    document.getElementById('statusBox').className = "status-msg success";
                    document.getElementById('statusBox').style.display = 'block';
                    setTimeout(()=>tg.close(), 2000);
                } else throw new Error(json.message);
            } catch(e) {
                document.getElementById('statusBox').innerHTML = "Gagal: "+e.message;
                document.getElementById('statusBox').className = "status-msg error";
                document.getElementById('statusBox').style.display = 'block';
                btn.disabled=false; btn.innerHTML='KIRIM DATA';
            }
        };
    </script>
</body>
</html>
