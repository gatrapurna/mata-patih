<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mata Patih v6.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        /* GAYA TAMPILAN (Sobat Logistik Dark Mode) */
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e1e; color: #eee; padding: 15px; text-align: center; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; background: #000; min-height: 250px; border: 2px solid #333; position: relative; }
        
        .form-group { margin-bottom: 10px; text-align: left; }
        label { font-size: 12px; color: #aaa; margin-left: 5px; margin-bottom: 2px; display: block;}
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; font-size: 16px; outline: none; }
        
        .row { display: flex; gap: 10px; } .col-8 { flex: 2; } .col-4 { flex: 1; }
        
        .btn { width: 100%; padding: 14px; margin-top: 15px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-scan { background-color: #3390ec; color: white; } 
        .btn-stop { background-color: #e74c3c; color: white; display: none; } 
        .btn-submit { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; }
        
        #skuInput { color: #f1c40f; font-weight: bold; text-align: center; letter-spacing: 1px; }
        #statusInfo { font-size: 12px; color: #888; margin-bottom: 10px; min-height: 18px;}
    </style>
</head>
<body>
    <div class="container">
        <h3 style="margin: 0 0 15px 0; color: #f1c40f;">👁️ MATA PATIH v6.0</h3>

        <div id="reader"></div>
        <div id="statusInfo">Siap memindai...</div>

        <button id="startScan" class="btn btn-scan" onclick="startCamera()">📷 NYALAKAN KAMERA</button>
        <button id="stopScan" class="btn btn-stop" onclick="stopCamera()">⏹ STOP KAMERA</button>

        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

        <div class="form-group">
            <label>Serial Number / SKU:</label>
            <input type="text" id="skuInput" placeholder="Scan atau Ketik Manual..." >
        </div>

        <div class="row">
            <div class="col-8">
                <div class="form-group">
                    <label>Status Barang:</label>
                    <select id="actionInput">
                        <option value="SCAN">🔍 Cek Info (Scan Only)</option>
                        <option value="IN">📥 Masuk Gudang (Restock)</option>
                        <option value="OUT">🎒 Ambil / Bawa (Teknisi)</option>
                        <option value="INSTALL">✅ Pasang ke Pelanggan</option>
                        <option value="RETUR">⚠️ Retur / Rusak</option>
                    </select>
                </div>
            </div>
            <div class="col-4">
                <div class="form-group">
                    <label>Jumlah:</label>
                    <input type="number" id="qtyInput" value="1" min="1">
                </div>
            </div>
        </div>

        <button id="sendBtn" class="btn btn-submit" onclick="sendData()">🚀 KIRIM DATA</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        let html5QrCode;

        function startCamera() {
            document.getElementById('startScan').style.display = 'none';
            document.getElementById('stopScan').style.display = 'block';
            document.getElementById('statusInfo').innerText = "⏳ Membuka kamera...";

            html5QrCode = new Html5Qrcode("reader");

            // Menggunakan konfigurasi kamera belakang yang lebih agresif
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    // SUKSES SCAN
                    tg.HapticFeedback.notificationOccurred('success');
                    document.getElementById('skuInput').value = decodedText;
                    document.getElementById('statusInfo').innerText = "✅ Sukses: " + decodedText;
                    stopCamera();
                },
                (errorMessage) => {
                    // Scanning...
                }
            ).catch(err => {
                alert("Gagal akses kamera: " + err);
                stopCamera();
            });
        }

        function stopCamera() {
            if(html5QrCode) {
                html5QrCode.stop().then(() => html5QrCode.clear());
            }
            document.getElementById('startScan').style.display = 'block';
            document.getElementById('stopScan').style.display = 'none';
            document.getElementById('statusInfo').innerText = "Siap memindai...";
        }

        function sendData() {
            const sku = document.getElementById('skuInput').value;
            if(!sku) {
                tg.showAlert("⚠️ SKU Kosong! Scan dulu atau ketik manual.");
                return;
            }

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerText = "📍 Mengambil Lokasi...";
            tg.MainButton.showProgress();

            // Ambil GPS (Wajib untuk Sistem V6)
            navigator.geolocation.getCurrentPosition((pos) => {
                const payload = {
                    action: document.getElementById('actionInput').value,
                    sku: sku,
                    qty: parseInt(document.getElementById('qtyInput').value),
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    meta: { device: "Mobile", source: "GITHUB_V6" } 
                };
                
                // Kirim data balik ke Telegram -> Masuk ke n8n TheFace
                tg.sendData(JSON.stringify(payload));
                tg.close();
            }, (err) => {
                tg.MainButton.hideProgress();
                btn.disabled = false;
                btn.innerText = "🚀 KIRIM DATA";
                alert("⚠️ Wajib GPS! Aktifkan lokasi HP Anda.");
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
