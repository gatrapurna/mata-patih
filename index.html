<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>P.A.T.I.H V1.1 — Hybrid Ops</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #3b82f6; --success: #10b981; --border: #334155; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 0.9rem; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 10px; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        
        /* Tombol Scanner & Foto */
        .btn-action { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; margin-bottom: 10px; transition: 0.2s; }
        .btn-scan { background: #f59e0b; color: #0f172a; }
        .btn-photo { background: rgba(59, 130, 246, 0.1); border: 2px dashed var(--accent); color: var(--accent); position: relative; overflow: hidden; }
        .btn-submit { background: var(--accent); color: white; margin-top: 10px; }
        .btn-submit:disabled { background: var(--border); }

        /* Scanner Area */
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; display: none; border: 2px solid var(--accent); }
        
        /* Input File Tersembunyi tapi Aktif */
        .hidden-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .status-msg { text-align: center; font-size: 0.9rem; margin-top: 10px; display: none; }
        .success { color: var(--success); } .error { color: #ef4444; }
    </style>
</head>
<body>
    <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="margin:0; color: var(--accent); letter-spacing: 1px;">P.A.T.I.H V1.1</h2>
        <p style="margin:5px 0 0; font-size: 0.8rem; color: #64748b;">Platform Aset & Tiketing Intelligent Hive</p>
    </div>

    <div class="card">
        <div id="reader"></div>

        <form id="patihForm">
            <label><i class="fas fa-exchange-alt"></i> Tipe Transaksi</label>
            <select id="act" required>
                <option value="INSTALLED">🏠 PASANG (Instalasi)</option>
                <option value="EX">🟡 TARIK (Dismantle)</option>
                <option value="BROKEN">🔴 RETUR (Rusak)</option>
                <option value="NEW">📦 STOK BARU (Restock)</option>
            </select>

            <label><i class="fas fa-box"></i> Nama Barang / SKU</label>
            <select id="sku_dropdown" onchange="syncSku(this.value)" required>
                <option value="">⏳ Mengambil Data Server...</option>
            </select>
            <input type="text" id="sku_manual" placeholder="Atau ketik/scan SKU manual..." style="margin-top: 5px; display:none;">

            <button type="button" id="btnScan" class="btn-action btn-scan">
                <i class="fas fa-qrcode"></i> SCAN BARCODE / QR
            </button>

            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
                <div>
                    <label>Jumlah</label>
                    <input type="number" id="qty" value="1" min="1" required>
                </div>
                <div>
                    <label>GPS Location</label>
                    <input type="text" id="gps" placeholder="Mencari Satelit..." readonly style="font-size: 12px; color: #fbbf24;">
                </div>
            </div>

            <label><i class="fas fa-camera"></i> Bukti Foto (Wajib)</label>
            <div class="btn-action btn-photo" id="photoContainer">
                <i class="fas fa-camera-retro"></i> <span id="photoLabel">Buka Kamera</span>
                <input type="file" id="photo" class="hidden-input" accept="image/*" capture="environment" required onchange="previewPhoto(this)">
            </div>

            <label>Keterangan</label>
            <textarea id="note" rows="2" placeholder="No. Tiket / ODP / Ket. Kerusakan"></textarea>

            <button type="submit" id="btnSubmit" class="btn-action btn-submit">
                <i class="fas fa-paper-plane"></i> KIRIM DATA
            </button>
            <div id="statusBox" class="status-msg"></div>
        </form>
    </div>

    <script>
        // --- CONFIG ---
        // GANTI INI DENGAN URL N8N ANDA!
        const N8N_BASE = "https://n8ring.gatrapurna.my.id/webhook/patih-v9/brain"; 
        
        const tg = window.Telegram.WebApp;
        const html5QrCode = new Html5Qrcode("reader");
        let lat = null, lng = null;

        tg.ready(); tg.expand();

        // 1. FETCH SKU LIST
        fetch(`${N8N_BASE}/get-sku-list`)
            .then(res => res.json())
            .then(data => {
                const sel = document.getElementById('sku_dropdown');
                sel.innerHTML = '<option value="">-- Pilih Aset --</option>';
                data.forEach(i => {
                    // Format: Nama Barang (SKU)
                    const opt = document.createElement('option');
                    opt.value = i.sku;
                    opt.textContent = `${i.name} (${i.sku})`;
                    sel.appendChild(opt);
                });
            })
            .catch(() => document.getElementById('sku_dropdown').innerHTML = '<option>❌ Gagal Load Data</option>');

        // 2. GPS LOGIC
        navigator.geolocation.getCurrentPosition(
            pos => {
                lat = pos.coords.latitude; lng = pos.coords.longitude;
                document.getElementById('gps').value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            },
            () => document.getElementById('gps').value = "⚠️ GPS Error/Denied"
        );

        // 3. SCANNER LOGIC
        let isScanning = false;
        document.getElementById('btnScan').onclick = () => {
            if (!isScanning) {
                document.getElementById('reader').style.display = 'block';
                html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 },
                    (decoded) => {
                        // Set value ke dropdown jika ada, atau switch ke manual jika tidak ada
                        const dropdown = document.getElementById('sku_dropdown');
                        let found = false;
                        for(let i=0; i<dropdown.options.length; i++){
                            if(dropdown.options[i].value === decoded){
                                dropdown.selectedIndex = i;
                                found = true; break;
                            }
                        }
                        if(!found) alert(`SKU Scanned: ${decoded}\n(Item ini tidak ada di list database, tapi data tetap tersimpan)`);
                        
                        // Simpan hasil scan meski tidak ada di dropdown (untuk fleksibilitas)
                        dropdown.value = decoded; 
                        
                        stopScan();
                        tg.HapticFeedback.notificationOccurred('success');
                    },
                    () => {}
                );
                document.getElementById('btnScan').innerHTML = '<i class="fas fa-stop"></i> STOP CAMERA';
                isScanning = true;
            } else stopScan();
        };

        function stopScan(){
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
                document.getElementById('btnScan').innerHTML = '<i class="fas fa-qrcode"></i> SCAN BARCODE / QR';
                isScanning = false;
            });
        }

        // 4. PHOTO PREVIEW
        function previewPhoto(input){
            if(input.files[0]){
                document.getElementById('photoLabel').textContent = "✅ Foto: " + input.files[0].name;
                document.getElementById('photoContainer').style.borderColor = "#10b981";
                document.getElementById('photoContainer').style.color = "#10b981";
            }
        }

        // 5. SUBMIT HANDLER
        document.getElementById('patihForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const sku = document.getElementById('sku_dropdown').value;
            
            if(!sku) return alert("Pilih Barang atau Scan dulu!");
            if(!document.getElementById('photo').files[0]) return alert("Wajib Foto Barang!");

            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MENGIRIM...';
            
            const formData = new FormData();
            formData.append('sku', sku);
            formData.append('act', document.getElementById('act').value);
            formData.append('qty', document.getElementById('qty').value);
            formData.append('note', document.getElementById('note').value);
            formData.append('lat', lat); formData.append('lng', lng);
            formData.append('photo', document.getElementById('photo').files[0]);
            
            if(tg.initDataUnsafe?.user) {
                formData.append('chat_id', tg.initDataUnsafe.user.id);
                formData.append('username', tg.initDataUnsafe.user.first_name);
            }

            try {
                const res = await fetch(`${N8N_BASE}/patih-v9/brain`, { method:'POST', body: formData });
                const json = await res.json();
                if(json.status === 'success'){
                    document.getElementById('statusBox').innerHTML = "✅ Laporan Terkirim!";
                    document.getElementById('statusBox').style.display = 'block';
                    tg.HapticFeedback.notificationOccurred('success');
                    setTimeout(() => tg.close(), 2000);
                } else throw new Error(json.message);
            } catch(err) {
                alert("Gagal: " + err.message);
                btn.disabled = false; btn.innerHTML = "COBA LAGI";
            }
        };
    </script>
</body>
</html>
