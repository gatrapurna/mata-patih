<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mata Patih - Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e1e; color: #eee; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: 0 auto; }
        .btn { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-scan { background: linear-gradient(135deg, #f1c40f, #f39c12); color: #1e1e1e; }
        .btn-submit { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; display: none; }
        .btn-cancel { background: #e74c3c; color: white; margin-top: 5px;}
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; }
        label { display: block; text-align: left; margin-top: 10px; font-size: 14px; color: #aaa; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 20px; background: #000; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h3>👁️ MATA PATIH v4.5</h3>
        
        <div id="reader"></div>
        
        <button id="startScan" class="btn btn-scan">📷 BUKA SCANNER</button>
        
        <div id="resultInfo" class="hidden">
            <label>Serial Number (SN):</label>
            <input type="text" id="snInput" placeholder="Hasil Scan..." readonly>
            
            <label>Jenis Perangkat:</label>
            <select id="jenisInput">
                <option value="ONT">ONT (Modem)</option>
                <option value="ROUTER">Router WiFi</option>
                <option value="STB">STB TV</option>
                <option value="ACCESS_POINT">Access Point</option>
            </select>
    
            <label>Merk:</label>
            <select id="merkInput">
                <option value="ZTE">ZTE</option>
                <option value="HUAWEI">Huawei</option>
                <option value="NOKIA">Nokia</option>
                <option value="FIBERHOME">Fiberhome</option>
            </select>
    
            <button id="sendData" class="btn btn-submit">📤 KIRIM KE GUDANG</button>
            <button onclick="location.reload()" class="btn btn-cancel">❌ Ulangi</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        const html5QrCode = new Html5Qrcode("reader");
        const startBtn = document.getElementById('startScan');
        const resultInfo = document.getElementById('resultInfo');
        const snInput = document.getElementById('snInput');
        const sendBtn = document.getElementById('sendData');

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    html5QrCode.stop();
                    document.getElementById('reader').style.display = 'none';
                    resultInfo.style.display = 'block';
                    snInput.value = decodedText;
                    sendBtn.style.display = 'block';
                    tg.HapticFeedback.notificationOccurred('success');
                },
                (err) => {}
            ).catch(err => {
                alert("Kamera tidak aktif. Pastikan izin browser diizinkan.");
                startBtn.style.display = 'block';
            });
        });

        sendBtn.addEventListener('click', () => {
            if(!snInput.value) return;
            const data = {
                action: "SCAN_MASUK_MINIAPP",
                sn: snInput.value,
                jenis: document.getElementById('jenisInput').value,
                merk: document.getElementById('merkInput').value
            };
            tg.sendData(JSON.stringify(data)); 
            tg.close();
        });
    </script>
</body>
</html>
