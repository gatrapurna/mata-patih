<script>
  const tg = window.Telegram?.WebApp;

  function isTelegramWebApp() {
    return tg && typeof tg.sendData === "function" && tg.initData && tg.initData.length > 0;
  }

  async function sendToWebhook(payload) {
    // GANTI dengan Production Webhook URL TheBrain kamu (bukan webhook-test)
    const WEBHOOK_URL = "https://DOMAIN-N8N-KAMU/webhook/patih-v6/brain";

    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...payload, mode: "LOGISTIC" })
    });

    // optional: lihat respon
    const data = await res.json().catch(() => ({}));
    alert("✅ Terkirim via Webhook\n" + JSON.stringify(data, null, 2));
  }

  function sendData() {
    const sku = document.getElementById('skuInput').value;
    if(!sku) {
      (tg?.showAlert ? tg.showAlert("⚠️ SKU Kosong! Scan dulu atau ketik manual.") : alert("⚠️ SKU Kosong!"));
      return;
    }

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.innerText = "📍 Mengambil Lokasi...";
    tg?.MainButton?.showProgress?.();

    navigator.geolocation.getCurrentPosition(async (pos) => {
      const payload = {
        action: document.getElementById('actionInput').value, // IN/OUT/INSTALL/RETUR/SCAN
        sku: sku,
        qty: parseInt(document.getElementById('qtyInput').value),
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        meta: { device: "Mobile", source: "GITHUB_V6" }
      };

      if (isTelegramWebApp()) {
        tg.HapticFeedback?.notificationOccurred?.('success');
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        // fallback mode (browser)
        tg?.MainButton?.hideProgress?.();
        btn.disabled = false;
        btn.innerText = "🚀 KIRIM DATA";
        await sendToWebhook(payload);
      }

    }, (err) => {
      tg?.MainButton?.hideProgress?.();
      btn.disabled = false;
      btn.innerText = "🚀 KIRIM DATA";
      alert("⚠️ Wajib GPS! Aktifkan lokasi HP Anda.");
    }, { enableHighAccuracy: true });
  }
</script>
