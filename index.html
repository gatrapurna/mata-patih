<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>P.A.T.I.H — Intelligent Ops</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #334155;
      --accent: #3b82f6;
      --text: #f1f5f9;
      --danger: #ef4444;
      --success: #10b981;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 5px;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Form Elements */
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #94a3b8;
    }

    input,
    select,
    textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid transparent;
      color: white;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
    }

    /* Scanner Area */
    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      display: none;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-secondary {
      background: #475569;
      color: white;
    }

    .btn-scan {
      background: #f59e0b;
      color: #0f172a;
      margin-bottom: 10px;
      width: 100%;
    }

    /* Feedback */
    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .status.success {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .status.error {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header">
      <h1>P.A.T.I.H V9.6</h1>
      <p>Protocol Autonomous Technical Inventory Handler</p>
    </div>

    <div id="reader"></div>

    <form id="patihForm" class="card">
      <label>Tipe Transaksi</label>
      <select id="act" required>
        <option value="Masuk Gudang">📥 Masuk Gudang (Restock)</option>
        <option value="Keluar Gudang">📤 Keluar Gudang (Usage)</option>
        <option value="Pasang">🔧 Pasang ke Client</option>
        <option value="Retur">↩️ Retur Barang</option>
      </select>

      <div style="margin-top: 15px;">
        <label>Serial Number / SKU</label>
        <button type="button" id="btnScan" class="btn btn-scan">📷 Scan Barcode/QR</button>
        <input id="sku" placeholder="Scan atau ketik manual..." required />
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
        <div>
          <label>Jumlah</label>
          <input id="qty" type="number" value="1" min="1" required />
        </div>
        <div>
          <label>GPS (Lat, Lng)</label>
          <input id="gps" placeholder="Auto-detect..." readonly />
        </div>
      </div>

      <div style="margin-top: 15px;">
        <label>Keterangan</label>
        <textarea id="note" rows="2" placeholder="ODP, No. Tiket, atau Keterangan..."></textarea>
      </div>

      <div style="display:none;">
        <label>Bukti Foto (Opsional)</label>
        <input type="file" id="photo" accept="image/*" capture="environment" />
      </div>
      <p style="font-size:12px; color:#fbbf24; text-align:center;">
        📸 Info: Foto bukti dikirim lewat Chat Telegram setelah klik tombol Kirim Data.
      </p>

      <button type="submit" id="btnSubmit" class="btn btn-primary" style="margin-top: 20px; width: 100%;">
        🚀 KIRIM DATA
      </button>

      <div id="statusBox" class="status"></div>
    </form>
  </div>

  <script>
    // --- CONFIGURATION ---
    const N8N_WEBHOOK_URL = "https://n8ring.gatrapurna.my.id/webhook/patih-v9/brain";

    const tg = window.Telegram.WebApp;
    const html5QrCode = new Html5Qrcode("reader");
    let lat = null, lng = null;

    // Init Telegram
    tg.ready();
    tg.expand();

    // --- GPS LOGIC ---
    function getGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            lat = pos.coords.latitude;
            lng = pos.coords.longitude;
            document.getElementById('gps').value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
          },
          (err) => { document.getElementById('gps').placeholder = "GPS Error / Denied"; }
        );
      }
    }
    getGPS();

    // --- SCANNER LOGIC (HD & BARCODE FIX) ---
    const btnScan = document.getElementById('btnScan');
    let isScanning = false;

    btnScan.addEventListener('click', () => {
      if (!isScanning) {
        document.getElementById('reader').style.display = 'block';
        
        // 1. ARGUMEN KEDUA: CONFIG (HD Settings masuk sini)
        const config = { 
          fps: 10,
          // Box dipipihkan agar user memposisikan barcode secara horizontal
          qrbox: { width: 280, height: 100 }, 
          aspectRatio: 1.0,
          
          // SETTINGAN HD DIPINDAH KE SINI (Benar)
          videoConstraints: {
              width: { min: 640, ideal: 1280, max: 1920 },
              height: { min: 480, ideal: 720, max: 1080 },
              focusMode: "continuous"
          },

          experimentalFeatures: {
              useBarCodeDetectorIfSupported: true
          },
          formatsToSupport: [ 
              Html5QrcodeSupportedFormats.QR_CODE,
              Html5QrcodeSupportedFormats.CODE_128, 
              Html5QrcodeSupportedFormats.CODE_39,
              Html5QrcodeSupportedFormats.EAN_13
          ]
        };

        // 2. ARGUMEN PERTAMA: CAMERA SELECTOR (Strictly one key)
        const cameraSelector = { facingMode: "environment" };

        html5QrCode.start(
          cameraSelector, 
          config,
          (decodedText, decodedResult) => {
            // Success Scan
            document.getElementById('sku').value = decodedText;
            stopScanner();
            tg.HapticFeedback.notificationOccurred('success');
          },
          (errorMessage) => {
            // Scanning...
          }
        ).catch(err => {
          alert("Kamera error: " + err);
          btnScan.innerText = "📷 Scan Barcode/QR";
          isScanning = false;
        });
        
        btnScan.innerText = "❌ Stop Camera";
        isScanning = true;
      } else {
        stopScanner();
      }
    });

    function stopScanner() {
      html5QrCode.stop().then(() => {
        document.getElementById('reader').style.display = 'none';
        btnScan.innerText = "📷 Scan Barcode/QR";
        isScanning = false;
      }).catch(err => console.log(err));
    }

    // --- SUBMIT LOGIC ---
    document.getElementById('patihForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const statusBox = document.getElementById('statusBox');

      btn.disabled = true;
      btn.innerText = "Mengirim...";
      statusBox.style.display = 'none';

      // Prepare Data
      const formData = new FormData();
      formData.append('source', 'miniapp_v9');
      formData.append('act', document.getElementById('act').value);
      formData.append('sku', document.getElementById('sku').value);
      formData.append('qty', document.getElementById('qty').value);
      formData.append('note', document.getElementById('note').value);
      formData.append('lat', lat || '');
      formData.append('lng', lng || '');

      // Telegram User Data
      if (tg.initDataUnsafe?.user) {
        formData.append('chat_id', tg.initDataUnsafe.user.id);
        formData.append('username', tg.initDataUnsafe.user.username || 'NoUsername');
      }

      // Photo File logic (Hidden but kept)
      const fileInput = document.getElementById('photo');
      if (fileInput.files.length > 0) {
        formData.append('photo', fileInput.files[0]);
      }

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (response.ok) {
          statusBox.innerText = "✅ Data Berhasil Disimpan!";
          statusBox.className = "status success";
          statusBox.style.display = 'block';
          tg.HapticFeedback.notificationOccurred('success');

          // Reset form partial
          document.getElementById('sku').value = '';
          document.getElementById('note').value = '';
          document.getElementById('photo').value = '';

          setTimeout(() => { tg.close(); }, 2000);
        } else {
          throw new Error(result.message || "Server Reject");
        }
      } catch (error) {
        statusBox.innerText = "❌ Gagal: " + error.message;
        statusBox.className = "status error";
        statusBox.style.display = 'block';
        tg.HapticFeedback.notificationOccurred('error');
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 KIRIM DATA";
      }
    });
  </script>

</body>
</html>
