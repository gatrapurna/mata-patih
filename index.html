<script>
  // --- CONFIGURATION ---
  // Pastikan URL ini sesuai dengan Production URL n8n Anda
  const N8N_WEBHOOK_URL = "https://n8ring.gatrapurna.my.id/webhook/patih-v9/brain"; 

  const tg = window.Telegram.WebApp;
  const html5QrCode = new Html5Qrcode("reader");
  let lat = null, lng = null;

  // Init Telegram
  tg.ready();
  tg.expand();

  // --- GPS LOGIC ---
  function getGPS() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          lat = pos.coords.latitude;
          lng = pos.coords.longitude;
          document.getElementById('gps').value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        },
        (err) => { document.getElementById('gps').placeholder = "GPS Error / Denied"; }
      );
    }
  }
  getGPS();

  // --- SCANNER LOGIC (UPGRADED) ---
  const btnScan = document.getElementById('btnScan');
  let isScanning = false;

  btnScan.addEventListener('click', () => {
    if (!isScanning) {
      document.getElementById('reader').style.display = 'block';
      
      // KONFIGURASI BARU: Support QR + Barcode (SN)
      const config = { 
        fps: 10, 
        qrbox: { width: 250, height: 150 }, // Kotak lebih lebar untuk barcode panjang
        formatsToSupport: [ 
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.CODE_128, // Standard SN
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.EAN_13
        ]
      };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config,
        (decodedText, decodedResult) => {
          // Success Scan
          document.getElementById('sku').value = decodedText;
          stopScanner();
          tg.HapticFeedback.notificationOccurred('success');
        },
        (errorMessage) => {
          // Scanning... (ignore errors)
        }
      ).catch(err => {
        alert("Kamera error: " + err);
        btnScan.innerText = "📷 Scan Barcode/QR";
        isScanning = false;
      });
      
      btnScan.innerText = "❌ Stop Camera";
      isScanning = true;
    } else {
      stopScanner();
    }
  });

  function stopScanner() {
    html5QrCode.stop().then(() => {
      document.getElementById('reader').style.display = 'none';
      btnScan.innerText = "📷 Scan Barcode/QR";
      isScanning = false;
    }).catch(err => console.log(err));
  }

  // --- SUBMIT LOGIC ---
  document.getElementById('patihForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    const statusBox = document.getElementById('statusBox');
    
    btn.disabled = true;
    btn.innerText = "Mengirim...";
    statusBox.style.display = 'none';

    // Prepare Data
    const formData = new FormData();
    formData.append('source', 'miniapp_v9');
    formData.append('act', document.getElementById('act').value);
    formData.append('sku', document.getElementById('sku').value);
    formData.append('qty', document.getElementById('qty').value);
    formData.append('note', document.getElementById('note').value);
    formData.append('lat', lat || '');
    formData.append('lng', lng || '');
    
    // Telegram User Data
    if (tg.initDataUnsafe?.user) {
      formData.append('chat_id', tg.initDataUnsafe.user.id);
      formData.append('username', tg.initDataUnsafe.user.username || 'NoUsername');
    }

    // Photo File (Keep logic just in case, though hidden)
    const fileInput = document.getElementById('photo');
    if (fileInput.files.length > 0) {
      formData.append('photo', fileInput.files[0]);
    }

    try {
      const response = await fetch(N8N_WEBHOOK_URL, {
        method: 'POST',
        body: formData
      });

      const result = await response.json();

      if (response.ok) {
        statusBox.innerText = "✅ Data Berhasil Disimpan!";
        statusBox.className = "status success";
        statusBox.style.display = 'block';
        tg.HapticFeedback.notificationOccurred('success');
        
        // Reset form partial
        document.getElementById('sku').value = '';
        document.getElementById('note').value = '';
        document.getElementById('photo').value = '';
        
        setTimeout(() => { tg.close(); }, 2000); 
      } else {
        throw new Error(result.message || "Server Reject");
      }
    } catch (error) {
      statusBox.innerText = "❌ Gagal: " + error.message;
      statusBox.className = "status error";
      statusBox.style.display = 'block';
      tg.HapticFeedback.notificationOccurred('error');
    } finally {
      btn.disabled = false;
      btn.innerText = "🚀 KIRIM DATA";
    }
  });
</script>
