<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>P.A.T.I.H — Intelligent Hive</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- HIVE DARK THEME V3 --- */
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --accent: #3b82f6; --success: #10b981; --border: #334155; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0; color: var(--accent); font-size: 1.5rem; }
        .header p { margin: 5px 0 0; color: var(--text-muted); font-size: 0.9rem; }

        .card { background: var(--card); border-radius: 12px; padding: 15px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 15px; }
        
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
        select, input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: white; font-size: 1rem; box-sizing: border-box; margin-bottom: 15px; }
        select:focus, input:focus { outline: none; border-color: var(--accent); }

        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-act { flex: 1; padding: 12px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); border-radius: 8px; cursor: pointer; transition: all 0.2s; font-weight: 600; }
        .btn-act.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        .btn-act.out.active { background: #ef4444; border-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }

        .main-btn { width: 100%; padding: 14px; background: var(--success); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .main-btn:active { transform: scale(0.98); }
        .main-btn:disabled { background: var(--border); cursor: not-allowed; opacity: 0.7; }

        .status-msg { display: none; padding: 12px; border-radius: 8px; text-align: center; margin-top: 15px; font-size: 0.9rem; }
        .status-msg.success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .status-msg.error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .status-msg.loading { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
        
        /* QR SCANNER */
        #qr-reader { border-radius: 10px; overflow: hidden; margin-bottom: 15px; border: 2px dashed var(--border); display: none; }
    </style>
</head>
<body>

    <div style="text-align: center; margin-bottom: 20px; padding-top: 5px;">
        <h2 style="margin:0; color: var(--accent); font-weight: 800; letter-spacing: 1px;">P.A.T.I.H</h2>
        <p style="margin:4px 0 0; font-size: 0.8rem; color: #94a3b8; font-weight: 500;">
            Platform Aset & Tiketing<br>
            <span style="color: var(--warning); font-size: 0.75rem;">⚡ INTELLIGENT HIVE v3.0</span>
        </p>
    </div>

    <div class="card">
        <label>Jenis Transaksi</label>
        <div class="btn-group">
            <button class="btn-act active" onclick="setAct('IN')"><i class="fas fa-arrow-down"></i> Masuk</button>
            <button class="btn-act out" onclick="setAct('OUT')"><i class="fas fa-arrow-up"></i> Keluar</button>
            <button class="btn-act" onclick="toggleScan()"><i class="fas fa-qrcode"></i> Scan</button>
        </div>
        <div id="qr-reader"></div>

        <label>Nama Barang / SKU</label>
        <select id="skuSelect">
            <option value="" disabled selected>⏳ Memuat Data Stok...</option>
        </select>

        <label>Jumlah (Qty)</label>
        <input type="number" id="qty" placeholder="0" min="1" inputmode="numeric">

        <label>Keterangan / Lokasi</label>
        <textarea id="notes" rows="2" placeholder="Contoh: Ambil dari Gudang A..."></textarea>

        <button id="submitBtn" class="main-btn" onclick="kirimData()">
            <i class="fas fa-paper-plane"></i> KIRIM LAPORAN
        </button>
        
        <div id="statusBox" class="status-msg"></div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const tg = window.Telegram.WebApp;
        tg.expand(); // Fullscreen Mode

        // Ganti dengan Domain n8n Anda (Tanpa slash di akhir)
        const N8N_HOST = "https://n8ring.gatrapurna.my.id/webhook"; 
        
        let currentAct = 'IN';
        let html5QrcodeScanner = null;

        // 1. LOAD DATA BARANG SAAT INIT
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                // Fetch ke Endpoint V3 Baru
                const res = await fetch(`${N8N_HOST}/patih-v3/sku`);
                if(!res.ok) throw new Error("Gagal ambil data");
                
                const data = await res.json();
                const sel = document.getElementById('skuSelect');
                sel.innerHTML = '<option value="" disabled selected>-- Pilih Barang --</option>';
                
                // Grouping by Category (Opsional jika API support)
                data.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.sku || item.name; // Fallback
                    opt.text = `${item.name} (Stok: ${item.stock})`;
                    sel.appendChild(opt);
                });
            } catch (e) {
                document.getElementById('skuSelect').innerHTML = '<option>⚠️ Gagal memuat data (Cek Koneksi)</option>';
                console.error(e);
            }
        });

        // 2. INTERACTION LOGIC
        function setAct(act) {
            currentAct = act;
            document.querySelectorAll('.btn-act').forEach(b => b.classList.remove('active'));
            const target = act === 'IN' ? 0 : 1;
            document.querySelectorAll('.btn-act')[target].classList.add('active');
            
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = act === 'IN' ? '<i class="fas fa-download"></i> LAPOR MASUK' : '<i class="fas fa-upload"></i> LAPOR KELUAR';
            btn.style.background = act === 'IN' ? 'var(--success)' : '#ef4444';
        }

        // 3. QR SCANNER LOGIC
        function toggleScan() {
            const reader = document.getElementById('qr-reader');
            if (reader.style.display === 'block') {
                if(html5QrcodeScanner) html5QrcodeScanner.clear();
                reader.style.display = 'none';
            } else {
                reader.style.display = 'block';
                html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: 250 });
                html5QrcodeScanner.render((decodedText) => {
                    // Auto Select jika QR cocok dengan Value Option
                    const sel = document.getElementById('skuSelect');
                    for(let i=0; i<sel.options.length; i++) {
                        if(sel.options[i].value === decodedText || sel.options[i].text.includes(decodedText)) {
                            sel.selectedIndex = i;
                            tg.HapticFeedback.impactOccurred('medium');
                            alert(`QR Terdeteksi: ${decodedText}`);
                            html5QrcodeScanner.clear();
                            reader.style.display = 'none';
                            return;
                        }
                    }
                    alert(`Barang tidak ditemukan di sistem: ${decodedText}`);
                });
            }
        }

        // 4. SUBMIT LOGIC (KIRIM KE N8N V3)
        window.kirimData = async () => {
            const sku = document.getElementById('skuSelect').value;
            const qty = document.getElementById('qty').value;
            const notes = document.getElementById('notes').value;
            const btn = document.getElementById('submitBtn');

            if(!sku || !qty) {
                tg.showAlert("Mohon pilih barang dan isi jumlah!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim...';
            document.getElementById('statusBox').style.display = 'none';

            // Siapkan Data
            const fd = new FormData();
            fd.append('act', currentAct);
            fd.append('sku', sku);
            fd.append('qty', qty);
            fd.append('notes', notes);
            
            // Data User Telegram (Jika dibuka via TG)
            if(tg.initDataUnsafe?.user) {
                fd.append('chat_id', tg.initDataUnsafe.user.id);
                fd.append('username', tg.initDataUnsafe.user.first_name);
            } else {
                // Fallback untuk Testing di Browser
                fd.append('chat_id', 'TEST_BROWSER');
                fd.append('username', 'WebAdmin');
            }

            try {
                // KIRIM KE ENDPOINT V3 (/brain)
                const res = await fetch(`${N8N_HOST}/patih-v3/brain`, { method:'POST', body:fd });
                const json = await res.json();
                
                if(json.status === 'success' || json.reply_text){
                    const msg = json.reply_text || "✅ Data Berhasil Disimpan!";
                    
                    document.getElementById('statusBox').innerHTML = msg;
                    document.getElementById('statusBox').className = "status-msg success";
                    document.getElementById('statusBox').style.display = "block";
                    tg.HapticFeedback.notificationOccurred('success');
                    
                    // Reset Form
                    document.getElementById('qty').value = '';
                    document.getElementById('notes').value = '';
                    
                    // Tutup otomatis setelah 3 detik
                    setTimeout(() => tg.close(), 3000);
                } else {
                    throw new Error("Respon server aneh.");
                }
            } catch(e) {
                document.getElementById('statusBox').innerHTML = "Gagal: " + e.message;
                document.getElementById('statusBox').className = "status-msg error";
                document.getElementById('statusBox').style.display = "block";
                btn.disabled = false;
                setAct(currentAct); // Reset tombol
            }
        };
    </script>
</body>
</html>
