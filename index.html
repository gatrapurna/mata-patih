<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mata Patih - Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        /* GAYA TAMPILAN (DARK MODE v4.5) */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #1e1e1e; 
            color: #eee; 
            padding: 15px; 
            text-align: center; 
            margin: 0;
        }
        .container { max-width: 400px; margin: 0 auto; }
        
        /* AREA KAMERA */
        #reader { 
            width: 100%; 
            border-radius: 12px; 
            overflow: hidden; 
            margin-bottom: 15px; 
            background: #000; 
            min-height: 250px; 
            border: 2px solid #333;
            position: relative;
        }

        /* INPUT & FORM */
        .form-group { margin-bottom: 10px; text-align: left; }
        label { font-size: 12px; color: #aaa; margin-left: 5px; margin-bottom: 2px; display: block;}
        
        input, select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #333; 
            color: white; 
            box-sizing: border-box; 
            font-size: 16px;
            outline: none;
        }
        
        /* Baris Input Gabungan (Action & Qty) */
        .row { display: flex; gap: 10px; }
        .col-8 { flex: 2; }
        .col-4 { flex: 1; }

        /* TOMBOL */
        .btn { 
            width: 100%; 
            padding: 14px; 
            margin-top: 15px; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            transition: 0.2s; 
            text-transform: uppercase;
        }
        
        /* Tombol Start (Biru Telegram) */
        .btn-scan { background-color: #3390ec; color: white; }
        /* Tombol Stop (Merah) */
        .btn-stop { background-color: #e74c3c; color: white; display: none; }
        /* Tombol Kirim (Hijau) */
        .btn-submit { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; }
        
        /* Input Hasil Scan (Kuning Emas) */
        #skuInput { color: #f1c40f; font-weight: bold; text-align: center; letter-spacing: 1px; }

        /* Loading Text */
        #statusInfo { font-size: 12px; color: #888; margin-bottom: 10px; min-height: 18px;}
    </style>
</head>
<body>
    <div class="container">
        <h3 style="margin: 0 0 15px 0; color: #f1c40f;">👁️ MATA PATIH v5.0</h3>

        <div id="reader"></div>
        <div id="statusInfo">Siap memindai...</div>

        <button id="startScan" class="btn btn-scan" onclick="startCamera()">📷 NYALAKAN KAMERA</button>
        <button id="stopScan" class="btn btn-stop" onclick="stopCamera()">⏹ STOP KAMERA</button>

        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

        <div class="form-group">
            <label>Serial Number / SKU:</label>
            <input type="text" id="skuInput" placeholder="Scan atau Ketik Manual..." >
        </div>

        <div class="row">
            <div class="col-8">
                <div class="form-group">
                    <label>Tindakan:</label>
                    <select id="actionInput">
                        <option value="SCAN">🔍 Cek Info</option>
                        <option value="IN">📥 Masuk Gudang</option>
                        <option value="OUT">📤 Pasang / Keluar</option>
                    </select>
                </div>
            </div>
            <div class="col-4">
                <div class="form-group">
                    <label>Jumlah:</label>
                    <input type="number" id="qtyInput" value="1" min="1">
                </div>
            </div>
        </div>

        <button id="sendBtn" class="btn btn-submit" onclick="sendData()">🚀 KIRIM DATA</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        let html5QrCode;
        let isScanning = false;

        // --- FUNGSI KAMERA ---
        function startCamera() {
            document.getElementById('startScan').style.display = 'none';
            document.getElementById('stopScan').style.display = 'block';
            document.getElementById('statusInfo').innerText = "⏳ Membuka kamera...";

            html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    // SUKSES SCAN
                    playSound();
                    document.getElementById('skuInput').value = decodedText;
                    document.getElementById('statusInfo').innerText = "✅ Sukses: " + decodedText;
                    
                    // Opsional: Stop kamera otomatis setelah scan agar hemat baterai
                    stopCamera();
                },
                (errorMessage) => {
                    // Scanning running...
                }
            ).catch(err => {
                alert("Gagal akses kamera: " + err);
                stopCamera();
            });
        }

        function stopCamera() {
            if(html5QrCode) {
                html5QrCode.stop().then(() => html5QrCode.clear());
            }
            document.getElementById('startScan').style.display = 'block';
            document.getElementById('stopScan').style.display = 'none';
            document.getElementById('statusInfo').innerText = "Siap memindai...";
        }

        function playSound() {
            tg.HapticFeedback.notificationOccurred('success');
        }

        // --- FUNGSI KIRIM DATA ---
        function sendData() {
            const sku = document.getElementById('skuInput').value;
            const action = document.getElementById('actionInput').value;
            const qty = document.getElementById('qtyInput').value;

            if(!sku) {
                tg.showAlert("⚠️ SKU/SN belum diisi! Scan dulu atau ketik manual.");
                return;
            }

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerText = "📍 Mengambil Lokasi...";
            tg.MainButton.showProgress();

            // Ambil GPS
            navigator.geolocation.getCurrentPosition((pos) => {
                const payload = {
                    action: action,
                    sku: sku,
                    qty: parseInt(qty),
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    // Meta info tambahan
                    meta: { source: "GITHUB_V5", device: "Mobile" } 
                };

                tg.sendData(JSON.stringify(payload));
                tg.close();
            }, (err) => {
                tg.MainButton.hideProgress();
                btn.disabled = false;
                btn.innerText = "🚀 KIRIM DATA";
                alert("⚠️ Gagal GPS: Pastikan GPS HP Aktif.\n" + err.message);
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
